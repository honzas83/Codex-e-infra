# setup.py merges this template into state/codex-home/config.toml.
# Provider configuration must live in the isolated CODEX_HOME user layer.

model = "default"
model_provider = "custom"
web_search = "disabled"
model_reasoning_summary = "none"

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[model_providers.custom]
name = "Custom Responses Provider"
base_url = "https://example.invalid/v1"
env_key = "CODEX_PROVIDER_API_KEY"
env_key_instructions = "Run setup.py; the key is stored in the local .env file."
wire_api = "responses"
requires_openai_auth = false
request_max_retries = 2
stream_max_retries = 2

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false
